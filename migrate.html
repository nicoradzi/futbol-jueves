<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migración · Fútbol del Jueves</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6fa;color:#111827}.box{max-width:720px;margin:40px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}input{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 14px;border:1px solid #d1d5db;border-radius:8px}button{padding:12px 18px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.log{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:16px;border-radius:10px;margin-top:18px;min-height:120px}</style></head>
<body><div class="box"><h1>Migración · Fútbol del Jueves</h1><p>Esta herramienta copia los datos actuales de la base anterior a Firebase. Se ejecuta una sola vez.</p>
<label>Email Firebase<input id="email" type="email" autocomplete="username"></label>
<label>Contraseña Firebase<input id="password" type="password" autocomplete="current-password"></label>
<button id="go">Iniciar sesión y migrar</button><div id="log" class="log">Esperando…</div></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260921a"></script>
<script src="config.js?v=20260921a"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),SUPA=window.APP_CONFIG;
const log=m=>{document.querySelector("#log").textContent+=("\n"+m)};
const read=async table=>{const r=await fetch(SUPA.SUPABASE_URL+"/rest/v1/"+table+"?select=*",{headers:{apikey:SUPA.SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPA.SUPABASE_ANON_KEY}});if(!r.ok)throw new Error("Supabase "+table+" HTTP "+r.status);return r.json()};
const idFor=(table,row)=>row.id??((table==="attendance"||table==="match_players")?row.match_id+"__"+row.player_id:null);
const write=async(table,rows)=>{for(const row of rows){const id=idFor(table,row),ref=id?db.collection(table).doc(String(id)):db.collection(table).doc();await ref.set(row)}};
document.querySelector("#go").onclick=async()=>{const b=document.querySelector("#go");b.disabled=true;document.querySelector("#log").textContent="";try{
const c=await auth.signInWithEmailAndPassword(document.querySelector("#email").value,document.querySelector("#password").value);log("✓ Firebase: "+c.user.email);
for(const t of ["players","matches","attendance","match_players"]){log("Leyendo "+t+"…");const rows=await read(t);log("  "+rows.length+" registros");await write(t,rows);log("  ✓ copiados")}
log("MIGRACIÓN TERMINADA. Ya podés cerrar esta página.");
}catch(e){log("ERROR: "+(e.message||e))}finally{b.disabled=false}};
</script></body></html>
